name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@3ce8f712b5d8f31acd8e201be6d97e3d2bb23eb7  # v25.1.0
        with:
          globs: "**/*.md"
      - name: Set up uv
        # SHA-pinned like the markdownlint action above. No Python project
        # here, so the cache key follows this workflow file (the tool list).
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: .github/workflows/lint.yml
      - name: Lint YAML
        run: |
          uvx yamllint -d "{extends: default, rules: {line-length: disable, document-start: disable}}" .github/
