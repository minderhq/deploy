name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34  # v25.0.0
        with:
          globs: "**/*.md"
      - name: Set up uv
        # SHA-pinned like the markdownlint action above. No Python project
        # here, so the cache key follows this workflow file (the tool list).
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: .github/workflows/lint.yml
      - name: Lint YAML
        run: |
          uvx yamllint -d "{extends: default, rules: {line-length: disable, document-start: disable}}" .github/
